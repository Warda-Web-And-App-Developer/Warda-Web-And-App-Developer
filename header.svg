<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1330"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5d7a"/>
      <stop offset="1" stop-color="#d2133b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .hi { font-size: 22px; fill: #8b93b8; letter-spacing: 4px; animation: slide 1.2s ease-out both; }
    .name { font-size: 62px; font-weight: 800; fill: url(#red); animation: slide 1.4s .2s ease-out both; }
    .role { font-size: 26px; fill: #e8ecff; font-family: 'Fira Code', Consolas, monospace; opacity: 0; }
    .r1 { animation: cycle 9s 0s infinite; }
    .r2 { animation: cycle 9s 3s infinite; }
    .r3 { animation: cycle 9s 6s infinite; }
    .star { fill: #fff; animation: twinkle 3s infinite; }
    @keyframes slide { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(12px); } 6%, 30% { opacity: 1; transform: translateY(0); } 36%, 100% { opacity: 0; transform: translateY(-12px); } }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  </style>

  <rect width="1000" height="280" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <circle class="star" cx="80" cy="30" r="1.6" style="animation-delay:0s"/>
  <circle class="star" cx="260" cy="60" r="1.2" style="animation-delay:.8s"/>
  <circle class="star" cx="430" cy="25" r="1.8" style="animation-delay:1.4s"/>
  <circle class="star" cx="560" cy="75" r="1.2" style="animation-delay:2s"/>
  <circle class="star" cx="640" cy="35" r="1.5" style="animation-delay:.4s"/>
  <circle class="star" cx="940" cy="50" r="1.6" style="animation-delay:1.1s"/>
  <circle class="star" cx="990" cy="130" r="1.2" style="animation-delay:2.4s"/>

  <!-- code-hexagon emblem -->
  <g transform="translate(830,120)" filter="url(#glow)">
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#d2133b" stop-opacity=".55"/>
        <stop offset="1" stop-color="#d2133b" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <circle r="70" fill="url(#halo)">
      <animate attributeName="r" values="60;78;60" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- outer hexagon: glowing dash chases around it -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
      <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="none" stroke="#2a3370" stroke-width="2"/>
      <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="none" stroke="#ff3b5c" stroke-width="3" stroke-linecap="round" stroke-dasharray="110 382">
        <animate attributeName="stroke-dashoffset" from="0" to="-492" dur="4s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- inner hexagon spins the other way -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="25s" repeatCount="indefinite"/>
      <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#0d1330" fill-opacity=".85" stroke="#5b6cff" stroke-width="2" stroke-dasharray="14 8" opacity=".9"/>
    </g>

    <!-- code symbol -->
    <text x="0" y="14" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="38" font-weight="700" fill="#ff3b5c">&lt;/&gt;
      <animate attributeName="opacity" values="1;.65;1" dur="2.4s" repeatCount="indefinite"/>
    </text>

    <!-- rising particles -->
    <rect x="-56" y="70" width="5" height="5" fill="#ff5d7a"><animate attributeName="y" values="80;-95" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="-24" y="70" width="4" height="4" fill="#fff"><animate attributeName="y" values="80;-95" dur="5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="18" y="70" width="5" height="5" fill="#5b6cff"><animate attributeName="y" values="80;-95" dur="3.5s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin=".5s" repeatCount="indefinite"/></rect>
    <rect x="48" y="70" width="4" height="4" fill="#ff5d7a"><animate attributeName="y" values="80;-95" dur="4.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="72" y="70" width="5" height="5" fill="#fff"><animate attributeName="y" values="80;-95" dur="6s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- text -->
  <text class="hi" x="60" y="82">HI, I'M</text>
  <text class="name" x="60" y="148">Warda Developer</text>
  <text class="role r1" x="60" y="196">&gt; Full-Stack Web Developer</text>
  <text class="role r2" x="60" y="196">&gt; 3D Web Experiences</text>
  <text class="role r3" x="60" y="196">&gt; React · Tailwind · Firebase</text>

  <!-- animated waves -->
  <path fill="#d2133b" opacity=".28" d="M0 232 q125 -34 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V280 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path fill="#5b6cff" opacity=".18" d="M0 244 q125 30 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V280 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path fill="#05070f" d="M0 258 q125 -22 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V280 H0 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
  </path>
</svg>
