<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 90" width="1000" height="90">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset=".08" stop-color="#fff"/>
      <stop offset=".92" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="edge"><rect width="1000" height="90" fill="url(#fade)"/></mask>

    <g id="set">
      <g transform="translate(0,23)">
        <rect width="150" height="44" rx="22" fill="#0f1636" stroke="#e34f26" stroke-width="2"/>
        <circle cx="26" cy="22" r="7" fill="#e34f26"/>
        <text x="44" y="28" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">HTML5</text>
      </g>
      <g transform="translate(170,23)">
        <rect width="150" height="44" rx="22" fill="#0f1636" stroke="#1572b6" stroke-width="2"/>
        <circle cx="26" cy="22" r="7" fill="#1572b6"/>
        <text x="44" y="28" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">CSS3</text>
      </g>
      <g transform="translate(340,23)">
        <rect width="150" height="44" rx="22" fill="#0f1636" stroke="#f7df1e" stroke-width="2"/>
        <circle cx="26" cy="22" r="7" fill="#f7df1e"/>
        <text x="44" y="28" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">JavaScript</text>
      </g>
      <g transform="translate(510,23)">
        <rect width="150" height="44" rx="22" fill="#0f1636" stroke="#06b6d4" stroke-width="2"/>
        <circle cx="26" cy="22" r="7" fill="#06b6d4"/>
        <text x="44" y="28" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Tailwind</text>
      </g>
      <g transform="translate(680,23)">
        <rect width="150" height="44" rx="22" fill="#0f1636" stroke="#61dafb" stroke-width="2"/>
        <circle cx="26" cy="22" r="7" fill="#61dafb"/>
        <text x="44" y="28" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">React</text>
      </g>
      <g transform="translate(850,23)">
        <rect width="150" height="44" rx="22" fill="#0f1636" stroke="#ffca28" stroke-width="2"/>
        <circle cx="26" cy="22" r="7" fill="#ffca28"/>
        <text x="44" y="28" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Firebase</text>
      </g>
      <g transform="translate(1020,23)">
        <rect width="150" height="44" rx="22" fill="#0f1636" stroke="#049ef4" stroke-width="2"/>
        <circle cx="26" cy="22" r="7" fill="#049ef4"/>
        <text x="44" y="28" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Three.js</text>
      </g>
      <g transform="translate(1190,23)">
        <rect width="150" height="44" rx="22" fill="#0f1636" stroke="#d2133b" stroke-width="2"/>
        <circle cx="26" cy="22" r="7" fill="#d2133b"/>
        <text x="44" y="28" fill="#e8ecff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">E-commerce</text>
