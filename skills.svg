  <g mask="url(#edge)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1360 0" dur="26s" repeatCount="indefinite"/>
      <use xlink:href="#set" href="#set" x="0"/>
      <use xlink:href="#set" href="#set" x="1360"/>
